# 매일 새벽(한국시간) KRX ETF 데이터를 자동으로 수집해서
# etf_data.db 를 갱신하고, 변경사항을 저장소에 자동 커밋/푸시합니다.
#
# ★ 이 파일이 동작하려면 GitHub 저장소 Settings > Secrets and variables
#    > Actions 에서 KRX_AUTH_KEY 라는 이름으로 인증키를 등록해야 합니다.
#
# ※ 원래는 저녁(18:30 KST) 실행이었으나, KRX Open API(data-dbg)가 당일 데이터를
#   장 마감 직후가 아니라 밤늦게~자정 넘어서야 확정 발표하는 것으로 확인되어
#   "전날 데이터가 확실히 나와 있는" 다음날 새벽으로 옮김.

name: Update ETF Data

on:
  schedule:
    # cron은 UTC 기준. 20:00 UTC = 익일 05:00 KST (전날 데이터가 확정 발표된 뒤)
    # KST 기준 월~금 새벽에 돌리려면, 그 전날 UTC 요일(일~목=0~4)에 예약해야 함
    # ※ GitHub Actions의 scheduled 트리거는 부하 시 몇 시간씩 지연될 수 있어
    #   실제 실행 시각이 05:00보다 늦어질 수 있음 (정확한 시각 보장 X)
    - cron: '0 20 * * 0-4'
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능하게 남겨둠

permissions:
  contents: write   # DB 파일을 커밋/푸시하기 위해 필요

jobs:
  update-etf-db:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: pip install requests

      - name: KRX 데이터 수집기 실행
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python krx_data_collector.py

      - name: 변경사항 있으면 자동 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_data.db
          git diff --staged --quiet || git commit -m "chore: ETF 데이터 자동 갱신 $(date +%Y-%m-%d)"
          git push
